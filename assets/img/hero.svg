<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Illustration : agent de nettoyage dans un salon lumineux">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0fdfa"/><stop offset="1" stop-color="#ccfbf1"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7d8c3"/><stop offset="1" stop-color="#d6c2a5"/></linearGradient>
    <radialGradient id="shine" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="640" fill="url(#wall)"/>
  <!-- window -->
  <rect x="440" y="70" width="290" height="270" rx="10" fill="#fff"/>
  <rect x="455" y="85" width="122" height="240" fill="url(#sky)"/>
  <rect x="593" y="85" width="122" height="240" fill="url(#sky)"/>
  <circle cx="660" cy="140" r="26" fill="#fde68a"/>
  <path d="M455 270q40-40 80-10t70-20 110 10v75H455z" fill="#99f6e4" opacity=".7"/>
  <path d="M470 110l40 60M600 100l60 90" stroke="#fff" stroke-width="10" opacity=".6"/>
  <!-- light beam -->
  <path d="M440 340L300 560h380l50-220z" fill="#fff" opacity=".35"/>
  <!-- shelf + frame -->
  <rect x="90" y="120" width="170" height="120" rx="6" fill="#fff"/>
  <rect x="102" y="132" width="146" height="96" fill="#5eead4"/>
  <path d="M102 228l50-50 35 30 30-25 31 45z" fill="#0f766e"/>
  <circle cx="215" cy="160" r="12" fill="#fef3c7"/>
  <!-- floor -->
  <rect y="470" width="800" height="170" fill="url(#floor)"/>
  <path d="M0 470h800" stroke="#c4ad8c" stroke-width="4"/>
  <ellipse cx="420" cy="560" rx="230" ry="38" fill="url(#shine)"/>
  <!-- sofa -->
  <rect x="60" y="360" width="300" height="80" rx="24" fill="#0b4f5c"/>
  <rect x="80" y="320" width="260" height="70" rx="20" fill="#11707f"/>
  <rect x="40" y="370" width="50" height="90" rx="18" fill="#0b4f5c"/>
  <rect x="330" y="370" width="50" height="90" rx="18" fill="#0b4f5c"/>
  <rect x="90" y="430" width="270" height="34" rx="10" fill="#094552"/>
  <rect x="110" y="462" width="12" height="20" fill="#5b4636"/><rect x="320" y="462" width="12" height="20" fill="#5b4636"/>
  <rect x="110" y="330" width="70" height="48" rx="14" fill="#f97360"/>
  <rect x="250" y="335" width="64" height="44" rx="14" fill="#fde68a"/>
  <!-- plant -->
  <path d="M735 470h-50l8-60h34z" fill="#f97360"/>
  <path d="M710 410c-30-40-40-90-20-120 10 40 20 60 20 120zM712 410c10-50 40-80 70-90-15 40-40 70-70 90zM708 412c-30-20-60-30-80-20 30 0 55 10 80 20z" fill="#0f766e"/>
  <!-- cleaner -->
  <g>
    <ellipse cx="520" cy="560" rx="70" ry="10" fill="#000" opacity=".08"/>
    <!-- mop -->
    <path d="M610 250L560 545" stroke="#8b5e3c" stroke-width="8" stroke-linecap="round"/>
    <path d="M520 548h80q6 14-4 16h-72q-10-2-4-16z" fill="#14b8a6"/>
    <!-- legs -->
    <path d="M495 440l-10 110M535 440l12 110" stroke="#0b4f5c" stroke-width="26" stroke-linecap="round"/>
    <path d="M470 556h30M540 556h32" stroke="#1f2937" stroke-width="14" stroke-linecap="round"/>
    <!-- body -->
    <path d="M470 300q45-25 90 0l12 150h-114z" fill="#14b8a6"/>
    <path d="M488 310h54v70h-54z" fill="#0d9488"/>
    <path d="M500 330h30" stroke="#ccfbf1" stroke-width="5" stroke-linecap="round"/>
    <!-- arms -->
    <path d="M555 315q40 10 50 -20" stroke="#14b8a6" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M478 318q-10 70 110 50" stroke="#14b8a6" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="604" cy="288" r="12" fill="#c68a5a"/>
    <circle cx="590" cy="368" r="12" fill="#c68a5a"/>
    <!-- head -->
    <rect x="503" y="270" width="22" height="26" rx="8" fill="#b97d4f"/>
    <circle cx="514" cy="240" r="38" fill="#c68a5a"/>
    <path d="M476 236q0-46 40-46t38 40q-20-18-50-14t-28 20z" fill="#1f2937"/>
    <path d="M474 228q40-30 82-6l2-10q-40-32-86 0z" fill="#f97360"/>
    <circle cx="528" cy="244" r="3.5" fill="#1f2937"/>
    <path d="M520 260q10 6 18-2" stroke="#7c4a2d" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <!-- bucket -->
  <path d="M630 500h70l-8 60h-54z" fill="#0b4f5c"/>
  <rect x="624" y="492" width="82" height="12" rx="6" fill="#11707f"/>
  <path d="M640 495q25-40 50 0" stroke="#11707f" stroke-width="5" fill="none"/>
  <!-- bubbles & sparkles -->
  <g fill="#fff" stroke="#99f6e4" stroke-width="2">
    <circle cx="650" cy="470" r="10"/><circle cx="672" cy="450" r="7"/><circle cx="690" cy="476" r="12"/>
    <circle cx="470" cy="530" r="8"/><circle cx="440" cy="548" r="5"/>
  </g>
  <g fill="#facc15">
    <path d="M390 200l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
    <path d="M300 520l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
    <path d="M760 380l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
  </g>
</svg>
