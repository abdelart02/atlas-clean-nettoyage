<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Illustration : nettoyage de maison et d'appartement">
  <rect width="600" height="420" fill="#fef3c7"/>
  <!-- upper cabinets -->
  <rect x="60" y="50" width="200" height="90" rx="6" fill="#fff"/>
  <path d="M160 50v90" stroke="#e5e7eb" stroke-width="4"/>
  <rect x="140" y="86" width="6" height="20" rx="3" fill="#94a3b8"/><rect x="174" y="86" width="6" height="20" rx="3" fill="#94a3b8"/>
  <!-- hood -->
  <path d="M330 50h120l20 70H310z" fill="#cbd5e1"/>
  <rect x="300" y="118" width="180" height="10" rx="4" fill="#94a3b8"/>
  <!-- window -->
  <rect x="500" y="50" width="80" height="110" rx="6" fill="#bae6fd"/>
  <path d="M540 50v110M500 105h80" stroke="#fff" stroke-width="6"/>
  <!-- counter -->
  <rect x="40" y="250" width="520" height="22" rx="4" fill="#0b4f5c"/>
  <rect x="50" y="272" width="500" height="110" fill="#fff"/>
  <path d="M175 272v110M300 272v110M425 272v110" stroke="#e5e7eb" stroke-width="4"/>
  <g fill="#94a3b8"><rect x="100" y="290" width="30" height="6" rx="3"/><rect x="225" y="290" width="30" height="6" rx="3"/><rect x="350" y="290" width="30" height="6" rx="3"/><rect x="475" y="290" width="30" height="6" rx="3"/></g>
  <rect y="382" width="600" height="38" fill="#e7d8c3"/>
  <!-- stove pan -->
  <ellipse cx="390" cy="246" rx="50" ry="8" fill="#374151"/>
  <path d="M350 230h80v12q-40 10-80 0z" fill="#1f2937"/>
  <path d="M430 234h50" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
  <!-- sink & tap -->
  <rect x="120" y="244" width="120" height="8" rx="4" fill="#94a3b8"/>
  <path d="M180 244v-40q0-14 14-14h12" stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- plates -->
  <g transform="translate(250 200)"><ellipse cx="20" cy="44" rx="30" ry="6" fill="#e5e7eb"/><ellipse cx="20" cy="36" rx="30" ry="6" fill="#fff" stroke="#e5e7eb" stroke-width="2"/><ellipse cx="20" cy="28" rx="30" ry="6" fill="#fff" stroke="#e5e7eb" stroke-width="2"/></g>
  <!-- glove + sponge -->
  <rect x="70" y="228" width="40" height="22" rx="5" fill="#fde68a"/><rect x="70" y="240" width="40" height="10" rx="3" fill="#14b8a6"/>
  <path d="M490 250v-50q0-12 12-12h6q12 0 12 12v50z" fill="#f97360"/>
  <path d="M490 220h-10q-8 0-8-10v-10" stroke="#f97360" stroke-width="10" stroke-linecap="round" fill="none"/>
  <g fill="#fff" stroke="#99f6e4" stroke-width="2"><circle cx="210" cy="232" r="8"/><circle cx="228" cy="222" r="6"/><circle cx="150" cy="230" r="7"/></g>
  <g fill="#facc15"><path d="M300 160l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/><path d="M80 180l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/></g>
</svg>
